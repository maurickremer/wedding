name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 */5 * *'  # Every 5 days at noon UTC
  workflow_dispatch:         # Allow manual trigger from GitHub UI
  workflow_run:              # Also fire on every deploy (keeps cron alive during quiet periods)
    workflows: ["Deploy to Vercel"]
    types: [completed]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ljtugpmazxzdxpzhtlyd.supabase.co/rest/v1/guests?select=count&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Unexpected status $STATUS — project may be paused"
            exit 1
          fi
          echo "Supabase is alive"
