name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel --prod --token "${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: team_IeAl6IU5SOx83ncOcR9VLidu
          VERCEL_PROJECT_ID: prj_7K397Ys7Dj48JTabxXwLWx832DhH
